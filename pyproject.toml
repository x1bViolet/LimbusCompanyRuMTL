[project]
name = "LimbusCompanyRuMTL"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "jsonpath-ng>=1.7.0",
    "loguru>=0.7.3",
    "msgspec>=0.20.0",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=9.1.1",
    "ruff>=0.11.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.basedpyright]
include = ["scripts", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "recommended"
failOnWarnings = true
stubPath = "typings"
